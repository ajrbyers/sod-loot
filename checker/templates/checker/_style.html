<style>
  :root {
    --bg: #0f1216; --bg2: #1a2028; --panel: #171b21; --panel2: #1e242c; --border: #2a323d;
    --text: #e6e1d3; --muted: #9aa4b0; --gold: #d4af37; --gold2: #f0d67a;
    --green: #4caf6d; --red: #e05656; --amber: #e0a94c; --blue: #5b8fd6;
    --shadow: rgba(0,0,0,.35); --h1shadow: #000; --heading: var(--gold2);
  }
  :root[data-theme="light"] {
    --bg: #eef1f5; --bg2: #ffffff; --panel: #ffffff; --panel2: #f1f4f8; --border: #dde2ea;
    --text: #1f2733; --muted: #647085; --gold: #b07a0a; --gold2: #955f00;
    --green: #12824c; --red: #c02a2a; --amber: #b06a0c; --blue: #2461ab;
    --shadow: rgba(30,45,70,.10); --h1shadow: transparent; --heading: #1c2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 50% -200px, var(--bg2), var(--bg));
    color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }
  header { text-align: center; margin-bottom: 28px; }
  h1 { font-size: 26px; margin: 0 0 6px; color: var(--heading);
       letter-spacing: .5px; text-shadow: 0 1px 0 var(--h1shadow); }
  header p { color: var(--muted); margin: 0; font-size: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px; margin-bottom: 22px; box-shadow: 0 8px 30px var(--shadow);
  }
  .card h2 { margin: 0 0 4px; font-size: 18px; color: var(--gold); }
  .card .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 11px 12px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; font-size: 15px;
  }
  input[type=text]:focus, input[type=password]:focus { outline: none; border-color: var(--gold); }
  textarea {
    width: 100%; padding: 11px 12px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; font-size: 15px;
    min-height: 84px; resize: vertical; font-family: inherit;
  }
  button {
    margin-top: 16px; background: linear-gradient(180deg, var(--gold2), var(--gold));
    color: #241c00; border: none; border-radius: 8px; padding: 11px 20px;
    font-weight: 700; font-size: 15px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .result { margin-top: 20px; }
  .verdict {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 10px;
    font-weight: 700; font-size: 16px; margin-bottom: 14px;
  }
  .verdict.pass { background: color-mix(in srgb, var(--green) 14%, transparent); border: 1px solid var(--green); color: var(--green); }
  .verdict.fail { background: color-mix(in srgb, var(--red) 12%, transparent); border: 1px solid var(--red); color: var(--red); }
  .verdict.warn { background: color-mix(in srgb, var(--amber) 14%, transparent); border: 1px solid var(--amber); color: var(--amber); }
  .check { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px;
           background: var(--panel2); border: 1px solid var(--border); border-radius: 9px; margin-bottom: 10px; }
  .check .badge { font-weight: 700; padding: 2px 9px; border-radius: 20px; font-size: 12px; white-space: nowrap; }
  .badge.ok { background: color-mix(in srgb, var(--green) 20%, transparent); color: var(--green); }
  .badge.no { background: color-mix(in srgb, var(--red) 20%, transparent); color: var(--red); }
  .badge.warn { background: color-mix(in srgb, var(--amber) 22%, transparent); color: var(--amber); }
  .radios { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .radio { flex: 1 1 200px; display: flex; align-items: center; gap: 10px; cursor: pointer;
           background: var(--panel2); border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px; }
  .radio:has(input:checked) { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, transparent); }
  .radio input { accent-color: var(--gold); width: 16px; height: 16px; }
  .radio span { display: flex; flex-direction: column; line-height: 1.25; }
  .radio small { color: var(--muted); font-size: 12px; }
  .slots { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
  .slotrow { display: flex; justify-content: space-between; gap: 8px; font-size: 13px;
             border-bottom: 1px solid var(--border); padding: 3px 0; }
  .slotrow .sname { color: var(--muted); }
  .sench.good { color: var(--green); } .sench.bad { color: var(--red); font-weight: 700; }
  .cacheline { display: flex; align-items: center; justify-content: space-between;
               margin-top: 14px; color: var(--muted); font-size: 12px; }
  button.small { margin-top: 0; padding: 5px 12px; font-size: 13px; }
  .check .body { flex: 1; }
  .check .body b { color: var(--text); }
  .check .detail { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .bosses { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 6px; margin-top: 10px; }
  .boss { display: flex; justify-content: space-between; align-items: center; gap: 8px;
          background: var(--panel2); border: 1px solid var(--border); border-radius: 7px;
          padding: 6px 10px; }
  .boss .bname { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .boss .bpct { font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
  .weeks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pill { background: color-mix(in srgb, var(--blue) 18%, var(--panel2)); color: var(--blue);
          border: 1px solid color-mix(in srgb, var(--blue) 45%, transparent);
          font-size: 12px; padding: 3px 9px; border-radius: 20px; }
  .item-result { padding: 13px 15px; border-radius: 9px; margin-top: 10px;
                 background: var(--panel2); border: 1px solid var(--border); }
  .item-result.rare { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, transparent); }
  .item-result .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
                      padding: 2px 8px; border-radius: 20px; font-weight: 700; }
  .tag.rare { background: color-mix(in srgb, var(--gold) 22%, transparent); color: var(--gold2); }
  .tag.std { background: color-mix(in srgb, var(--blue) 20%, transparent); color: var(--blue); }
  .item-result .name { font-size: 15px; font-weight: 700; }
  .item-result .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .error { color: var(--red); background: color-mix(in srgb, var(--red) 10%, transparent); border: 1px solid var(--red);
           padding: 12px 14px; border-radius: 9px; margin-top: 16px; }
  .spin { color: var(--muted); font-size: 14px; margin-top: 16px; }
  .rare-list { columns: 2; column-gap: 20px; font-size: 13px; color: var(--muted); margin: 6px 0 0; padding-left: 18px; }
  .rare-list li { margin-bottom: 4px; break-inside: avoid; }
  a { color: var(--gold2); }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 10px; }
  .num { color: var(--gold2); font-weight: 700; }
  #themeToggle { position: fixed; top: 14px; right: 14px; z-index: 10;
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 20px; padding: 7px 12px; font-size: 13px; cursor: pointer; margin: 0; }
  #themeToggle:hover { border-color: var(--gold); }
  /* Character autosuggest dropdown */
  .suggest-wrap { position: relative; }
  .suggest { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30;
             background: var(--panel2); border: 1px solid var(--border); border-radius: 9px;
             box-shadow: 0 10px 30px var(--shadow); overflow: hidden; }
  .suggest .opt { display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
                  padding: 9px 13px; cursor: pointer; }
  .suggest .opt + .opt { border-top: 1px solid var(--border); }
  .suggest .opt:hover, .suggest .opt.active { background: color-mix(in srgb, var(--gold) 12%, transparent); }
  .suggest .opt .cname { font-weight: 700; }
  .suggest .opt .cmeta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  /* Bulk highest-DPS table */
  .dps-scroll { overflow-x: auto; margin-top: 14px; }
  .dps-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .dps-table th, .dps-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; }
  .dps-table th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .dps-table .r { text-align: right; font-variant-numeric: tabular-nums; }
  .dps-table .cls { color: var(--muted); font-size: 12px; }
  .dps-table tfoot td { border-top: 2px solid var(--gold); border-bottom: none;
    color: var(--gold2); }
  .dps-table tfoot td:first-child { color: var(--muted); font-size: 12px;
    text-transform: uppercase; letter-spacing: .5px; }
  /* Requirement checklist in item results */
  .reqs { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
  .req { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .req .dot { width: 16px; text-align: center; }
  .req.need { color: var(--text); } .req.na { color: var(--muted); }
  .req.pass .dot { color: var(--green); } .req.fail .dot { color: var(--red); }
  /* Cross-page nav */
  #siteNav { position: fixed; top: 14px; left: 14px; z-index: 10; display: flex; gap: 6px; }
  #siteNav a { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 20px; padding: 7px 12px; font-size: 13px; text-decoration: none; }
  #siteNav a:hover, #siteNav a.active { border-color: var(--gold); }
  select { width: 100%; padding: 11px 12px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
  select:focus { outline: none; border-color: var(--gold); }
</style>
