# SoD Loot Checker — default site on the server's IP.
# Installed to /etc/nginx/sites-available/sod-loot and symlinked into sites-enabled.
# NOTE: this claims `default_server`. If another enabled site is already the
# default_server on :80, nginx -t will fail — remove/adjust that one first
# (commonly `rm /etc/nginx/sites-enabled/default`).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Named so certbot --nginx can match it; still the default for bare-IP hits.
    # sslip.io maps <ip>.sslip.io -> the IP, so Let's Encrypt can cert it with no
    # DNS setup. Swap for your own (sub)domain if you have one.
    server_name 67.205.160.192.sslip.io;

    client_max_body_size 4m;

    location /static/ {
        alias /opt/sod-loot/staticfiles/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/sod-loot/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Cold-cache sweeps (leaderboard, report cards, a first Naxxramas
        # lookup) legitimately run for minutes. nginx defaults to 60s, which
        # returned an HTML 504 mid-sweep and broke the JSON the pages expect.
        # Keep in step with --timeout in deploy/sod-loot.service.
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
